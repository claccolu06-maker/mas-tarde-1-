<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProcrastinIA - Tu Gestor de Tareas</title>
    <!-- Conectamos el diseño -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- EL CRISTAL OSCURO (Contenedor Principal) -->
    <div class="container" id="app">

        <!-- ========================================== -->
        <!-- HABITACIÓN 1: LA SALA DE ESPERA (Login)    -->
        <!-- ========================================== -->
        <div id="pantalla-login">
            <h1>ProcrastinIA</h1>
            <p style="margin-bottom: 30px; color: #ccc;">El noble arte de dejar las cosas para mañana... <br> ¡Enfréntalo hoy!</p>
            
            <!-- Botón gigante y llamativo para entrar -->
            <button id="login-btn">Entrar con Google 🚀</button>
        </div>


        <!-- ========================================== -->
        <!-- HABITACIÓN 2: EL CENTRO DE MANDO (Oculto)  -->
        <!-- ========================================== -->
        <!-- OJO: Tiene la clase "oculto" para que no se vea al inicio -->
        <div id="pantalla-dashboard" class="oculto">
            
            <h2 style="color: #00f2fe; margin-top: 0;">Tus Tareas</h2>
            
            <!-- Caja para escribir y botón de añadir -->
            <div style="margin-bottom: 20px;">
                <input type="text" id="nueva-tarea" placeholder="¿Qué vas a posponer hoy?">
                <button id="agregar-btn">Añadir</button>
            </div>

            <!-- La lista donde aparecerán las tareas -->
            <ul id="lista-tareas">
                <!-- Javascript meterá los <li> aquí adentro -->
            </ul>

            <br>
            <!-- Botón de salir (más pequeño y discreto para que no estorbe) -->
            <button id="logout-btn" style="background: transparent; border: 1px solid #ff4b2b; color: #ff4b2b; font-size: 12px; padding: 8px 15px; margin-top: 20px;">
                Cerrar Sesión
            </button>
            
        </div>

    </div>

    <!-- Conectamos el cerebro (Asegúrate de que app.js sea un módulo) -->
    <script type="module" src="app.js"></script>
</body>
</html>
